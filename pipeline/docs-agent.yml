# docs-agent — auto-draft doc updates on merged PRs using Cloudflare GLM 5.3 Flash.
#
# TEMPLATE: copy this file to `.github/workflows/docs-agent.yml` in EACH
# product repo and set the two marked spots for the product. It is configured
# for the hosted GLM backend (a metered API key). The driver itself always runs
# from the docs repo checkout below — fix it there once, and every product repo
# picks it up on its next run.
#
# Flow: PR merged → detect user-facing changes → GLM-5.3-Flash drafts MDX against
# the CANONICAL flat sources → run-migration regenerates content/docs →
# draft PR opened against smynkr/tiletactician-docs (base branch auto-detected).
# This hosted template never configures a fallback backend: provider, payment,
# authentication, and timeout failures are reported without another metered
# request. The driver makes exactly one same-provider retry only when its first
# request receives HTTP 429, honoring a bounded `Retry-After` delay under one
# absolute timeout budget.
#
# GitHub auth is split by direction:
#   DOCS_AGENT_SOURCE_TOKEN = source PR reads (the source repository).
#   GH_TOKEN (DOCS_REPO_PAT) = destination docs-repo operations.
# The docs checkout never needs the source token, and the model receives only
# its own metered API key.
#
# Required repo secrets:
#   DOCS_REPO_PAT  — PAT with Contents R/W + PRs R/W on
#                    smynkr/tiletactician-docs (docs checkout + draft PR).
#   CLOUDFLARE_WORKERS_AI_TOKEN — account-scoped Workers AI token
#
# Required repo variables:
#   CLOUDFLARE_ACCOUNT_ID         — exactly 32 lowercase hexadecimal characters
#   DOCS_AGENT_GLM_API_BASE      — Cloudflare OpenAI-compatible AI endpoint
#   DOCS_AGENT_GLM_MODEL         — optional; defaults to @cf/zai-org/glm-5.3-flash
#   DOCS_AGENT_GLM_MAX_TOKENS    — defaults to 49152
#   DOCS_AGENT_GLM_REASONING_EFFORT — only exact Cloudflare GLM-5.3-Flash;
#                                    low, medium, or high; defaults to high
name: docs-agent

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to draft docs for (defaults to the triggering PR)"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

env:
  # >>> EDIT per product repo (must match the flat source dir in the docs repo) <<<
  DOCS_AGENT_PRODUCT: tiletactician
  DOCS_AGENT_DOCS_REPO: smynkr/tiletactician-docs
  DOCS_AGENT_BACKEND: glm

jobs:
  detect:
    name: detect (free — no LLM call)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      needs_docs: ${{ steps.check.outputs.needs_docs }}
      pr_number: ${{ steps.check.outputs.pr_number }}
    steps:
      - name: Resolve PR number
        id: pr
        env:
          PR_INPUT: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          PR="$PR_INPUT"
          if [ -z "$PR" ]; then echo "No PR number resolved" >&2; exit 1; fi
          if ! echo "$PR" | grep -qE '^[0-9]+$'; then echo "Invalid PR number: $PR" >&2; exit 1; fi
          echo "pr_number=$PR" >> "$GITHUB_OUTPUT"

      - name: List changed files and apply exclude filter
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pr_number }}
        run: |
          FILES=$(gh pr view "$PR" --repo "${{ github.repository }}" --json files -q '.files[].path')
          echo "Changed files:"
          echo "$FILES"
          KEPT=$(echo "$FILES" | grep -vE \
            '(package-lock\.json|pnpm-lock\.yaml|yarn\.lock|Cargo\.lock|go\.sum|\.test\.|\.spec\.|/__tests__/|/test/|/tests/|^\.github/|/node_modules/|/dist/|/build/|/\.next/|\.snap$|/scripts/internal/)' \
            || true)
          echo "User-facing (kept):"
          echo "$KEPT"
          echo "pr_number=$PR" >> "$GITHUB_OUTPUT"
          if [ -n "$KEPT" ]; then
            echo "needs_docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_docs=false" >> "$GITHUB_OUTPUT"
          fi

  hosted:
    name: hosted (GLM 5.2 — drafts doc update)
    needs: detect
    if: needs.detect.outputs.needs_docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs repo
        uses: actions/checkout@v4
        with:
          repository: smynkr/tiletactician-docs
          token: ${{ secrets.DOCS_REPO_PAT }}
          path: tiletactician-docs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tiletactician-docs/package-lock.json

      # The driver regenerates content/docs via _migration/tools/run-migration.mjs,
      # which needs the docs repo's dependencies (yaml, lucide-react).
      - name: Install docs repo dependencies
        working-directory: tiletactician-docs
        run: npm ci

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run docs-agent with Cloudflare GLM 5.3 Flash
        env:
          DOCS_AGENT_SOURCE_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.DOCS_REPO_PAT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GLM_API_KEY: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
          DOCS_AGENT_GLM_API_BASE: ${{ vars.DOCS_AGENT_GLM_API_BASE }}
          DOCS_AGENT_GLM_MODEL: ${{ vars.DOCS_AGENT_GLM_MODEL }}
          DOCS_AGENT_GLM_MAX_TOKENS: ${{ vars.DOCS_AGENT_GLM_MAX_TOKENS }}
          DOCS_AGENT_GLM_REASONING_EFFORT: ${{ vars.DOCS_AGENT_GLM_REASONING_EFFORT || 'high' }}
          DOCS_AGENT_LOG_DIR: ${{ github.workspace }}/docs-agent-logs
        run: |
          node tiletactician-docs/pipeline/docs-agent.mjs \
            --repo "${{ github.repository }}" \
            --pr "${{ needs.detect.outputs.pr_number }}" \
            --docs-repo "smynkr/tiletactician-docs" \
            --docs-repo-path "$(pwd)/tiletactician-docs" \
            --product "$DOCS_AGENT_PRODUCT" \
            --standalone \
            --backend glm

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-agent-logs-${{ needs.detect.outputs.pr_number }}
          path: docs-agent-logs/
          retention-days: 14
