name: harness-memory

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  memory:
    name: Validate canonical memory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic memory gates
        run: npm run memory:check
